name: Дайджест вакансий

on:
  schedule:
    # 06:00 UTC = 09:00 MSK — основной дайджест.
    # 07:00 UTC = 10:00 MSK — подработка.
    # GitHub задерживает запуски по расписанию на 5-20 минут при нагрузке,
    # гарантированной минутной точности нет.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "За сколько последних суток собирать (по умолчанию 1)"
        required: false
        default: "1"
      stream:
        description: "Какой поток отправить"
        required: false
        type: choice
        options: ["both", "main", "gigs"]
        default: "both"

# Нужны для коммита seen.db обратно в репозиторий.
permissions:
  contents: write

# Два одновременных запуска писали бы в seen.db наперегонки.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна для rebase при повторной попытке push.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      # Ломаный фильтр разошлёт мусор и пометит его показанным — вернуть
      # такие вакансии будет уже нельзя. Лучше упасть до отправки.
      - name: Проверить фильтры
        run: |
          python tests/test_filters.py
          python tests/test_gig_filters.py

      - name: Собрать и отправить дайджест
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # По расписанию inputs пустой — main.py возьмёт значение по умолчанию.
          DIGEST_DAYS: ${{ inputs.days }}
          # По расписанию inputs пустой, поток выбирается по времени запуска.
          DIGEST_STREAM: ${{ inputs.stream || (github.event.schedule == '0 7 * * *' && 'gigs' || 'main') }}
        run: python main.py

      - name: Сохранить показанные вакансии
        # Только если отправка прошла успешно: иначе вакансии будут
        # помечены как показанные и потеряны навсегда.
        run: |
          if [[ -z "$(git status --porcelain seen.db)" ]]; then
            echo "seen.db не изменился, коммитить нечего"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.db
          git commit -m "Обновить список показанных вакансий"
          # Дайджест уже отправлен. Если push не пройдёт, seen.db не сохранится
          # и завтра те же вакансии придут повторно — поэтому одна повторная
          # попытка поверх чужих коммитов.
          git push || (git pull --rebase && git push)
