# операторы и координаторы, а не оценка и развитие персонала.
gig_channels:
  # Зеркало сайта kadrout.ru, который сам закрыт авторизацией.
  # Удалённая работа, из неё в подработку проходит около шести позиций
  # за две недели.
  - name: kadrout

